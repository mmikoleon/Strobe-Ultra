<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Strobe Studio Ultra</title>

<link rel="manifest" href="manifest.json">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #controls {
    position: absolute;
    bottom: 10px;
    left: 5%;
    transform: translateX(-50%);
    width: 95%;
    max-width: 90px;
    padding: 12px;
    background: rgba(0,0,0,0.7);
    border-radius: 12px;
    box-sizing: border-box;
    backdrop-filter: blur(10px);
  }

    .fullscreen-mode #controls > *:not(fullscreenBtn) {
    display: none;
  }  

  label {
    display: block;
    margin-top: 8px;
    font-size: 0.9rem;
  }

  input[type="range"], select {
    width: 100%;
    margin-top: 4px;
  }

  button {
    width: 100%;
    padding: 8px;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  #toggleBtn { background: #ffffff; color: #000; }
  #pulseBtn { background: #39ff14; color: #000; }
  #soundBtn { background: #00ffff; color: #000; }
  #randomBtn { background: #ffbf00; color: #000; }
  #blackoutBtn { background: #444; color: #fff; }
  #speedSpikeBtn { background: #ff6ec7; color: #000; }
  #colorStormBtn { background: #fe019a; color: #000; }
  #rouletteBtn { background: #39ff14; color: #000; }
  #beatPulseBtn { background: #00ff88; color: #000; }
  #kaleidoBtn { background: #ff073a; color: #fff; }
  #chaosBtn { background: #000; color: #ff0000; border: 1px solid #ff0000; }
  #fullscreenBtn { background: #222; color: #fff; }

  #presetRow {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  .presetBtn {
    flex: 1;
    padding: 6px;
    font-size: 0.8rem;
    background: #222;
    color: #fff;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  #dangerNotice {
    margin-top: 4px;
    font-size: 0.75rem;
    color: #ff073a;
  }

  /* Kaleidoscope container */
  #kaleido {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .k-panel {
    position: absolute;
    width: 50%;
    height: 50%;
    background: radial-gradient(circle, #fff, #000);
    transform-origin: center;
  }

  .k1 { top: 0; left: 0; }
  .k2 { top: 0; right: 0; }
  .k3 { bottom: 0; left: 0; }
  .k4 { bottom: 0; right: 0; }

  @keyframes kaleidoStorm {
    0%   { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
    25%  { transform: scale(1.3) rotate(90deg); filter: hue-rotate(90deg); }
    50%  { transform: scale(0.8) rotate(180deg); filter: hue-rotate(180deg); }
    75%  { transform: scale(1.4) rotate(270deg); filter: hue-rotate(270deg); }
    100% { transform: scale(1) rotate(360deg); filter: hue-rotate(360deg); }
  }

  .k-panel.storm {
    animation: kaleidoStorm 3s linear infinite;
  }
</style>
</head>

<body>
<div id="app">
  <div id="kaleido">
    <div class="k-panel k1"></div>
    <div class="k-panel k2"></div>
    <div class="k-panel k3"></div>
    <div class="k-panel k4"></div>
  </div>

  <div id="controls">
    <label for="speed">Strobe Speed</label>
    <input id="speed" type="range" min="1" max="25" value="5">

    <label for="mode">Color Mode</label>
    <select id="mode">
      <option value="bw">Black & White</option>
      <option value="rgb">RGB</option>
      <option value="neon">Neon</option>
      <option value="auto">Auto Cycle</option>
    </select>

    <div id="presetRow">
      <button class="presetBtn" data-preset="club">Club</button>
      <button class="presetBtn" data-preset="rave">Rave</button>
      <button class="presetBtn" data-preset="chill">Chill</button>
      <button class="presetBtn" data-preset="neonstorm">Neon Storm</button>
    </div>

    <button id="toggleBtn">Start Strobe</button>
    <button id="pulseBtn">Pulse Mode</button>
    <button id="soundBtn">Sound Reactive</button>
    <button id="randomBtn">Random Flicker</button>

    <button id="blackoutBtn">Random Blackout Bursts</button>
    <button id="speedSpikeBtn">Random Speed Spikes</button>
    <button id="colorStormBtn">Color Storms</button>
    <button id="rouletteBtn">Mode Roulette</button>
    <button id="beatPulseBtn">Beat‑Synced Pulse</button>
    <button id="kaleidoBtn">Fractal Kaleidoscope</button>

    <button id="chaosBtn">CHAOS MODE</button>
    <button id="fullscreenBtn">Fullscreen</button>

    <div id="dangerNotice"></div>
  </div>
</div>

<script>
  // PWA registration
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }

  // Core state
  let active = false;
  let pulse = false;
  let soundReactive = false;
  let randomFlicker = false;

  let blackoutBursts = false;
  let speedSpikes = false;
  let colorStorms = false;
  let modeRoulette = false;
  let beatPulse = false;
  let kaleidoOn = false;

  let chaosOn = false;

  let frameCount = 0;
  let targetFrame = 5;
  let isWhite = false;

  let autoCycleIndex = 0;
  let lastAutoCycleTime = 0;

  const speed = document.getElementById("speed");
  const mode = document.getElementById("mode");
  const toggleBtn = document.getElementById("toggleBtn");
  const pulseBtn = document.getElementById("pulseBtn");
  const soundBtn = document.getElementById("soundBtn");
  const randomBtn = document.getElementById("randomBtn");
  const blackoutBtn = document.getElementById("blackoutBtn");
  const speedSpikeBtn = document.getElementById("speedSpikeBtn");
  const colorStormBtn = document.getElementById("colorStormBtn");
  const rouletteBtn = document.getElementById("rouletteBtn");
  const beatPulseBtn = document.getElementById("beatPulseBtn");
  const kaleidoBtn = document.getElementById("kaleidoBtn");
  const chaosBtn = document.getElementById("chaosBtn");
  const fullscreenBtn = document.getElementById("fullscreenBtn");
  const dangerNotice = document.getElementById("dangerNotice");
  const presetButtons = document.querySelectorAll(".presetBtn");
  const kaleido = document.getElementById("kaleido");
  const kPanels = document.querySelectorAll(".k-panel");

  let audioContext = null;
  let analyser = null;
  let dataArray = null;

  // Speed slider + danger notice
  speed.addEventListener("input", () => {
    targetFrame = Number(speed.value);
    dangerNotice.textContent = targetFrame <= 2
      ? "Warning: Very fast strobe. Use with caution."
      : "";
  });

  // Color generator
  function baseColor() {
    let m = mode.value;

    if (modeRoulette) {
      const modes = ["bw", "rgb", "neon", "auto"];
      m = modes[Math.floor(Math.random() * modes.length)];
    }

    if (m === "bw") return isWhite ? "#ffffff" : "#000000";

    if (m === "rgb")
      return `rgb(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255})`;

    if (m === "neon") {
      const neon = ["#39ff14", "#ff073a", "#fe019a", "#00ffff", "#ff6ec7"];
      return neon[Math.floor(Math.random() * neon.length)];
    }

    if (m === "auto") {
      const modes = ["bw", "rgb", "neon"];
      const now = Date.now();
      if (now - lastAutoCycleTime > 1500) {
        autoCycleIndex = (autoCycleIndex + 1) % modes.length;
        lastAutoCycleTime = now;
      }
      const current = modes[autoCycleIndex];
      if (current === "bw") return isWhite ? "#ffffff" : "#000000";
      if (current === "rgb")
        return `rgb(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255})`;
      if (current === "neon") {
        const neon = ["#39ff14", "#ff073a", "#fe019a", "#00ffff", "#ff6ec7"];
        return neon[Math.floor(Math.random() * neon.length)];
      }
    }

    return "#000000";
  }

  function randomFlickerColor() {
    const neon = ["#39ff14", "#ff073a", "#fe019a", "#00ffff", "#ff6ec7"];
    const modes = ["bw", "rgb", "neon"];

    const pickMode = modes[Math.floor(Math.random() * modes.length)];

    if (pickMode === "bw")
      return Math.random() > 0.5 ? "#ffffff" : "#000000";

    if (pickMode === "rgb")
      return `rgb(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255})`;

    if (pickMode === "neon")
      return neon[Math.floor(Math.random() * neon.length)];
  }

  // Sound reactive setup
  async function initSoundReactive() {
    if (audioContext) return;

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      const bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      source.connect(analyser);
    } catch (e) {
      console.log("Microphone access denied or unavailable.", e);
    }
  }

  function getSoundLevel() {
    if (!analyser || !dataArray) return 0;
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return sum / dataArray.length;
  }

  // Main loop
  function mainLoop() {
    if (!active && !pulse && !beatPulse) return;

    frameCount++;

    let effectiveFrame = targetFrame;

    // Speed spikes
    if (speedSpikes && Math.random() < 0.1) {
      effectiveFrame = Math.max(1, Math.floor(Math.random() * 5) + 1);
    }

    // Sound reactive strobe
    if (soundReactive && analyser) {
      const level = getSoundLevel();
      effectiveFrame = Math.max(1, 25 - Math.floor(level / 8));
    }

    // Random flicker timing
    if (randomFlicker) {
      effectiveFrame = Math.floor(Math.random() * 20) + 1;
    }

    // Pulse / beat‑pulse brightness
    if (pulse || beatPulse) {
      const t = (Date.now() % 1000) / 1000;
      let brightness = Math.abs(Math.sin(t * Math.PI));
      if (beatPulse && analyser) {
        const level = getSoundLevel();
        brightness = Math.min(1, brightness + level / 255);
      }
      const val = brightness * 255;
      document.body.style.backgroundColor = `rgb(${val}, ${val}, ${val})`;
    }

    // Strobe / storms / blackout
    if (active && frameCount >= effectiveFrame) {
      frameCount = 0;
      isWhite = !isWhite;

      // Blackout bursts
      if (blackoutBursts && Math.random() < 0.08) {
        document.body.style.backgroundColor = "#000000";
      } else if (colorStorms && Math.random() < 0.4) {
        // Color storms
        const stormColor = `hsl(${Math.random()*360}, 100%, 50%)`;
        document.body.style.backgroundColor = stormColor;
      } else {
        const color = randomFlicker ? randomFlickerColor() : baseColor();
        document.body.style.backgroundColor = color;
      }
    }

    // Kaleidoscope
    if (kaleidoOn) {
      kaleido.style.opacity = 1;
      kPanels.forEach((p, i) => {
        p.classList.add("storm");
        p.style.background = `radial-gradient(circle, hsl(${(Date.now()/20 + i*90)%360},100%,70%), #000)`;
      });
    } else {
      kaleido.style.opacity = 0;
      kPanels.forEach(p => p.classList.remove("storm"));
    }

    requestAnimationFrame(mainLoop);
  }

  // Presets
  function applyPreset(name) {
    if (name === "club") {
      speed.value = 8;
      targetFrame = 8;
      mode.value = "neon";
    } else if (name === "rave") {
      speed.value = 2;
      targetFrame = 2;
      mode.value = "rgb";
    } else if (name === "chill") {
      speed.value = 12;
      targetFrame = 12;
      mode.value = "bw";
    } else if (name === "neonstorm") {
      speed.value = 4;
      targetFrame = 4;
      mode.value = "auto";
    }

    dangerNotice.textContent = targetFrame <= 2
      ? "Warning: Very fast strobe. Use with caution."
      : "";
  }

  presetButtons.forEach(btn => {
    btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
  });

  // Start/stop strobe
  toggleBtn.addEventListener("click", () => {
    pulse = false;
    beatPulse = false;

    pulseBtn.textContent = "Pulse Mode";
    beatPulseBtn.textContent = "Beat‑Synced Pulse";

    active = !active;

    if (active) {
      toggleBtn.textContent = "Stop Strobe";
      mainLoop();
    } else {
      toggleBtn.textContent = "Start Strobe";
      document.body.style.backgroundColor = "#000000";
    }
  });

  // Pulse mode
  pulseBtn.addEventListener("click", () => {
    active = false;
    beatPulse = false;

    toggleBtn.textContent = "Start Strobe";
    beatPulseBtn.textContent = "Beat‑Synced Pulse";

    pulse = !pulse;
    if (pulse) {
      pulseBtn.textContent = "Stop Pulse";
      mainLoop();
    } else {
      pulseBtn.textContent = "Pulse Mode";
      document.body.style.backgroundColor = "#000000";
    }
  });

  // Sound reactive
  soundBtn.addEventListener("click", async () => {
    pulse = false;
    beatPulse = false;

    pulseBtn.textContent = "Pulse Mode";
    beatPulseBtn.textContent = "Beat‑Synced Pulse";

    active = !active;

    if (active) {
      await initSoundReactive();
      soundReactive = true;
      soundBtn.textContent = "Stop Sound Reactive";
      toggleBtn.textContent = "Stop Strobe";
      mainLoop();
    } else {
      soundReactive = false;
      soundBtn.textContent = "Sound Reactive";
      toggleBtn.textContent = "Start Strobe";
      document.body.style.backgroundColor = "#000000";
    }
  });

  // Random flicker
  randomBtn.addEventListener("click", () => {
    randomFlicker = !randomFlicker;
    randomBtn.textContent = randomFlicker ? "Random Flicker (On)" : "Random Flicker";
  });

  // Blackout bursts
  blackoutBtn.addEventListener("click", () => {
    blackoutBursts = !blackoutBursts;
    blackoutBtn.textContent = blackoutBursts ? "Blackout Bursts (On)" : "Random Blackout Bursts";
  });

  // Speed spikes
  speedSpikeBtn.addEventListener("click", () => {
    speedSpikes = !speedSpikes;
    speedSpikeBtn.textContent = speedSpikes ? "Speed Spikes (On)" : "Random Speed Spikes";
  });

  // Color storms
  colorStormBtn.addEventListener("click", () => {
    colorStorms = !colorStorms;
    colorStormBtn.textContent = colorStorms ? "Color Storms (On)" : "Color Storms";
  });

  // Mode roulette
  rouletteBtn.addEventListener("click", () => {
    modeRoulette = !modeRoulette;
    rouletteBtn.textContent = modeRoulette ? "Mode Roulette (On)" : "Mode Roulette";
  });

  // Beat‑synced pulse
  beatPulseBtn.addEventListener("click", async () => {
    active = false;
    pulse = false;

    toggleBtn.textContent = "Start Strobe";
    pulseBtn.textContent = "Pulse Mode";

    beatPulse = !beatPulse;
    if (beatPulse) {
      await initSoundReactive();
      beatPulseBtn.textContent = "Stop Beat‑Pulse";
      mainLoop();
    } else {
      beatPulseBtn.textContent = "Beat‑Synced Pulse";
      document.body.style.backgroundColor = "#000000";
    }
  });

  // Kaleidoscope
  kaleidoBtn.addEventListener("click", () => {
    kaleidoOn = !kaleidoOn;
    kaleidoBtn.textContent = kaleidoOn ? "Fractal Kaleidoscope (On)" : "Fractal Kaleidoscope";
  });

   // Fullscreen
  fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        //enter fllscrn
        
  document.documentElement.requestFullscreen().catch(() => {});
  document.body.classList.add("fullscreen-mode");
        fullscreenBtn.textContent = "Exit Fullscreen";
      } else {
        document.exitFullscreen().catch(() => {});
      }
  });
  
  // Chaos Mode (auto‑fullscreen)
  chaosBtn.addEventListener("click", async () => {
    chaosOn = !chaosOn;

    if (chaosOn) {
      // Turn everything on
      active = true;
      pulse = false;
      soundReactive = true;
      randomFlicker = true;
      blackoutBursts = true;
      speedSpikes = true;
      colorStorms = true;
      modeRoulette = true;
      beatPulse = true;
      kaleidoOn = true;

      toggleBtn.textContent = "Stop Strobe";
      pulseBtn.textContent = "Pulse Mode";
      soundBtn.textContent = "Sound Reactive (On)";
      randomBtn.textContent = "Random Flicker (On)";
      blackoutBtn.textContent = "Blackout Bursts (On)";
      speedSpikeBtn.textContent = "Speed Spikes (On)";
      colorStormBtn.textContent = "Color Storms (On)";
      rouletteBtn.textContent = "Mode Roulette (On)";
      beatPulseBtn.textContent = "Stop Beat‑Pulse";
      kaleidoBtn.textContent = "Fractal Kaleidoscope (On)";
      chaosBtn.textContent = "CHAOS MODE (On)";

      await initSoundReactive();
      document.documentElement.requestFullscreen().catch(() => {});
      mainLoop();
    } else {
      // Turn everything off
      active = false;
      pulse = false;
      soundReactive = false;
      randomFlicker = false;
      blackoutBursts = false;
      speedSpikes = false;
      colorStorms = false;
      modeRoulette = false;
      beatPulse = false;
      kaleidoOn = false;

      toggleBtn.textContent = "Start Strobe";
      soundBtn.textContent = "Sound Reactive";
      randomBtn.textContent = "Random Flicker";
      blackoutBtn.textContent = "Random Blackout Bursts";
      speedSpikeBtn.textContent = "Random Speed Spikes";
      colorStormBtn.textContent = "Color Storms";
      rouletteBtn.textContent = "Mode Roulette";
      beatPulseBtn.textContent = "Beat‑Synced Pulse";
      kaleidoBtn.textContent = "Fractal Kaleidoscope";
      chaosBtn.textContent = "CHAOS MODE";

      document.body.style.backgroundColor = "#000000";
    }
  });
</script>
</body>
</html>
